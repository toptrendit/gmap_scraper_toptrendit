name: GMap Scraper Worker

on:
  repository_dispatch:
    types: [run_worker]

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Start Scraper
        run: |
          # 1. Chạy Docker
          mkdir -p gmapsdata
          docker run -d -v "$PWD/gmapsdata:/gmapsdata" -p 8080:8080 gosom/google-maps-scraper -data-folder /gmapsdata

      - name: Start Cloudflare Tunnel
        run: |
          # 2. Bật Tunnel
          nohup cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          
          # 3. Đợi sinh URL
          sleep 15
          
          # 4. IN URL RA LOG (Cực kỳ quan trọng để n8n đọc được)
          TUNNEL_URL=$(grep -o 'https://[-a-z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
          echo "FINAL_TUNNEL_URL=$TUNNEL_URL"
          
          # 5. Treo máy để n8n vào lấy dữ liệu
          sleep 600
