name: GMap Scraper Worker

on:
  repository_dispatch:
    types: [run_worker]

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Install Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: 2. Start Scraper
        run: |
          mkdir -p gmapsdata
          docker run -d -v "$PWD/gmapsdata:/gmapsdata" -p 8080:8080 gosom/google-maps-scraper -data-folder /gmapsdata

      - name: 3. Start Tunnel & Send to n8n
        run: |
          # Khởi chạy tunnel
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8080 > tunnel.log 2>&1 &
          
          echo "Đang chờ Cloudflare sinh URL..."
          TUNNEL_URL=""
          
          # Vòng lặp quét tìm URL hợp lệ
          for i in {1..15}; do
            sleep 5
            RAW_URL=$(grep -o 'https://[-a-z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1 | tr -d '\r\n ')
            if [ -n "$RAW_URL" ]; then
              TUNNEL_URL=$RAW_URL
              break
            fi
            echo "Lần thử $i: Chưa thấy URL, đang đợi..."
          done

          # Kiểm tra nếu rỗng thì cứu hộ in log
          if [ -z "$TUNNEL_URL" ]; then
            echo "LỖI: Không khởi tạo được Tunnel!"
            cat tunnel.log
            exit 1
          fi

          echo "------------------------------------------"
          echo "FINAL_TUNNEL_URL=$TUNNEL_URL"
          echo "------------------------------------------"
          
          # Bắn URL về n8n
          echo "------------------------------------------"
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"tunnel_url\": \"${TUNNEL_URL}\", \"run_id\": \"${{ github.run_id }}\"}"
          
          # Treo máy ảo đợi n8n xử lý lấy data (Sau đó n8n gọi API Cancel để diệt máy này)
          echo ""
          echo "------------------------------------------"
          echo "Đã gửi URL thành công. Đang treo máy chờ n8n xử lý..."
          sleep 600
