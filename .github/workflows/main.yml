name: GMap Scraper Worker

on:
  repository_dispatch:
    types: [run_worker]

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Install Cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: 2. Start Scraper
        run: |
          mkdir -p gmapsdata
          docker run -d -v "$PWD/gmapsdata:/gmapsdata" -p 8080:8080 gosom/google-maps-scraper -data-folder /gmapsdata

      - name: 3. Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          
          echo "Đang chờ Cloudflare sinh URL..."
          for i in {1..12}; do
            TUNNEL_URL=$(grep -o 'https://[-a-z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "------------------------------------------"
              echo "FINAL_TUNNEL_URL=$TUNNEL_URL"
              echo "------------------------------------------"
              break
            fi
            sleep 5
          done
          
      - name: 4. Send Tunnel URL to n8n
        run: |
          curl -X POST ${{ secrets.N8N_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "{\"tunnel_url\": \"$TUNNEL_URL\", \"run_id\": \"${{ github.run_id }}\"}"
          
          # Treo máy đợi n8n xử lý (hoặc dùng API GitHub Cancel để hủy sớm)
          sleep 600
